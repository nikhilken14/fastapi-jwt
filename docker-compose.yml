version: "3.8"

services:
  auth-service:
    build: .
    container_name: auth_demo
    ports:
      - "8040:8000"
    environment:
      - APP_NAME=auth-service
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite+aiosqlite:////app/data/auth.db
      - SECRET_KEY=${SECRET_KEY:-insecure-dev-secret-change-me}
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    volumes:
      - auth-data:/app/data

volumes:
  auth-data: